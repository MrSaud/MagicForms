name: MagicFormsMobile
options:
  bundleIdPrefix: com.magicforms
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MagicFormsMobile:
    type: application
    platform: iOS
    sources:
      - path: MagicFormsMobile
        excludes:
          - Resources/Info.plist
    resources:
      - MagicFormsMobile/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicforms.mobile
        INFOPLIST_FILE: MagicFormsMobile/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEVELOPMENT_TEAM: ""
    info:
      path: MagicFormsMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: MagicForms
        UILaunchScreen: {}
