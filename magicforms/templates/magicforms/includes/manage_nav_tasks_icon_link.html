{% load i18n %}
<a
  href="{{ studio_task_list_url }}"
  class="mf-portal-submission-search mf-manage-nav-tasks"
  {% if manage_open_task_count %}
  aria-label="{% blocktrans count counter=manage_open_task_count %}My tasks, {{ counter }} open{% plural %}My tasks, {{ counter }} open{% endblocktrans %}"
  {% else %}
  aria-label="{% trans 'My tasks' %}"
  {% endif %}
>
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 11l3 3L22 4" />
    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
  </svg>
  {% if manage_open_task_count %}
  <span class="mf-manage-nav-tasks__badge" aria-hidden="true">{% if manage_open_task_count > 99 %}99+{% else %}{{ manage_open_task_count }}{% endif %}</span>
  {% endif %}
</a>
