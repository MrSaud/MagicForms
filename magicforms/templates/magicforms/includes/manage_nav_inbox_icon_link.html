{% load i18n %}
<a
  href="{% url 'manage:inbox' %}"
  class="mf-portal-submission-search mf-manage-nav-inbox"
  {% if manage_inbox_count %}
  aria-label="{% blocktrans count counter=manage_inbox_count %}Inbox, {{ counter }} open request{% plural %}Inbox, {{ counter }} open requests{% endblocktrans %}"
  {% else %}
  aria-label="{% trans 'Inbox' %}"
  {% endif %}
>
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
  </svg>
  {% if manage_inbox_count %}
  <span class="mf-manage-nav-inbox__badge" aria-hidden="true">{% if manage_inbox_count > 99 %}99+{% else %}{{ manage_inbox_count }}{% endif %}</span>
  {% endif %}
</a>
